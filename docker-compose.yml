services:
  app:
    build: .
    profiles: ["core", "load"]
    ports:
      - "8002:8002"
    environment:
      - DEBUG=True
      # The tracing half of the identity, declared beside the scrape
      # labels rather than compiled in: OTEL_SERVICE_NAME carries the
      # same value as prometheus.io/job below, so `job` and
      # `service.name` name one service. A test asserts they agree.
      - OTEL_SERVICE_NAME=fastapi-app
      # http/protobuf on 4318, not gRPC on 4317: one connection does not
      # justify grpcio in the image. The Collector accepts both.
      - OTEL_EXPORTER_OTLP_ENDPOINT=http://otel-collector:4318
      - OTEL_EXPORTER_OTLP_PROTOCOL=http/protobuf
      - OTEL_TRACES_EXPORTER=otlp
      # Off, both of them. Prometheus still pulls /metrics and nothing
      # here logs; leaving either at its default would send a second
      # copy of the metrics down a path no dashboard reads.
      - OTEL_METRICS_EXPORTER=none
      - OTEL_LOGS_EXPORTER=none
      # The semantic convention, pinned rather than defaulted. `http`
      # selects the stable names — http.request.method,
      # http.response.status_code, http.route — over the pre-1.0 ones
      # this SDK still emits by default. The failure it prevents is
      # silent: a query written against one set matches nothing against
      # the other, with no error anywhere.
      - OTEL_SEMCONV_STABILITY_OPT_IN=http
      # The scrape is not application traffic, and at one scrape every
      # five seconds it would be most of what the trace store holds.
      # This is the same rule the Go and Node services follow by leaving
      # /metrics uninstrumented; the app's instrumentation is automatic,
      # so the exclusion is declared instead.
      - OTEL_PYTHON_EXCLUDED_URLS=metrics
    labels:
      # The scrape contract. `job` and `port` are not derived from the compose
      # service name on purpose: `job` keys the series already in
      # prometheus_data, and the port is the one the process listens on, not
      # whatever the container happens to publish.
      prometheus.io/scrape: "true"
      prometheus.io/job: "fastapi-app"
      prometheus.io/port: "8002"
    restart: unless-stopped
    healthcheck:
      # /health, not /metrics: readiness now means the router came up,
      # and both services answer readiness the same way. Only the URL
      # changed — the probe form is left alone, since rewriting a
      # working check buys nothing here.
      test:
        - "CMD"
        - "python"
        - "-c"
        - "import urllib.request; urllib.request.urlopen('http://localhost:8002/health')"
      interval: 10s
      timeout: 3s
      retries: 3
      start_period: 30s

  service-go:
    build:
      context: ./service-go
      dockerfile: Dockerfile
    profiles: ["core", "load"]
    ports:
      - "8003:8003"
    # The only environment this service reads, and it reads none of it
    # by name: the OTel SDK does. Same shape as the other two, with
    # OTEL_SERVICE_NAME carrying the value of prometheus.io/job below.
    environment:
      - OTEL_SERVICE_NAME=service-go
      - OTEL_EXPORTER_OTLP_ENDPOINT=http://otel-collector:4318
      - OTEL_EXPORTER_OTLP_PROTOCOL=http/protobuf
      - OTEL_TRACES_EXPORTER=otlp
      - OTEL_METRICS_EXPORTER=none
      - OTEL_LOGS_EXPORTER=none
      # Declared for the same reason as in the other two blocks, and it
      # decides less here: this service pins the convention in an import
      # path, `semconv/v1.43.0`, which is the version otelhttp emits.
      - OTEL_SEMCONV_STABILITY_OPT_IN=http
    labels:
      prometheus.io/scrape: "true"
      prometheus.io/job: "service-go"
      prometheus.io/port: "8003"
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:8003/health"]
      interval: 10s
      timeout: 3s
      retries: 3
      # 10s is measured, not copied from a neighbour: the binary logs
      # itself listening 0.18s after .State.StartedAt, and Docker's first
      # probe lands 5.2s in and passes in under 0.1s. 10s keeps that first
      # probe inside the start period, so a cold start on a loaded machine
      # is retried instead of counting against `retries`.
      start_period: 10s

  service-node:
    build:
      context: ./service-node
      dockerfile: Dockerfile
    profiles: ["core", "load"]
    ports:
      - "8004:8004"
    # The only environment this service reads, and it reads none of it
    # itself: the SDK does, in tracing.mjs. Same shape as the app's,
    # with OTEL_SERVICE_NAME carrying the value of prometheus.io/job
    # below.
    environment:
      - OTEL_SERVICE_NAME=service-node
      - OTEL_EXPORTER_OTLP_ENDPOINT=http://otel-collector:4318
      - OTEL_EXPORTER_OTLP_PROTOCOL=http/protobuf
      - OTEL_TRACES_EXPORTER=otlp
      - OTEL_METRICS_EXPORTER=none
      - OTEL_LOGS_EXPORTER=none
      # The stable HTTP names, for the reason the app pins them: a
      # dashboard written against one set of names matches nothing
      # against the other, and says nothing about why.
      - OTEL_SEMCONV_STABILITY_OPT_IN=http
    labels:
      prometheus.io/scrape: "true"
      prometheus.io/job: "service-node"
      prometheus.io/port: "8004"
    restart: unless-stopped
    healthcheck:
      # `node -e` rather than a wget probe: the runtime is already in the
      # image, so the check does not depend on what the base image ships.
      # The Go service's wget works only because Alpine's BusyBox
      # provides it, and the pinning rule forbids picking an image for
      # the probe's sake.
      test:
        - "CMD"
        - "node"
        - "-e"
        - "fetch('http://localhost:8004/health').then(r=>process.exit(r.ok?0:1),()=>process.exit(1))"
      interval: 10s
      timeout: 3s
      retries: 3
      start_period: 10s

  noisy:
    # The app's image with a different command: the root Dockerfile is
    # `COPY . .`, so this module already ships in it. That is the whole
    # reason a fourth language was not added — a bad citizen needs to
    # misbehave, not to be a fourth proof that any language can join.
    build: .
    command: ["python", "-m", "noisy.raw_path_emitter"]
    # Not in `core` and not in `load`. Its series are demonstration
    # garbage and the TSDB keeps them for the retention window, so they
    # reach prometheus_data only when someone asks for them by name.
    profiles: ["chaos"]
    # It opts in with the same four labels as every well-behaved
    # service, and nothing vets the difference. That is the argument
    # for the ceiling: discovery cannot tell them apart, so the limit
    # has to.
    labels:
      prometheus.io/scrape: "true"
      prometheus.io/job: "noisy"
      prometheus.io/port: "8005"
    # `no`, where every other service carries `unless-stopped`. A restart
    # policy belongs to the daemon and a profile does not: `unless-stopped`
    # would bring this container back on the next daemon or host restart
    # without anyone naming the chaos profile, which is the "only when
    # someone asks for them by name" above undone.
    restart: "no"
    # No `ports:` — Prometheus reaches it over the compose network, and
    # prometheus.io/port is the port the process listens on rather than
    # one it publishes. No healthcheck either: nothing waits on this
    # service, and publishing nothing is what excuses it from the rule.

  prometheus:
    image: prom/prometheus:v3.13.2
    profiles: ["core"]
    volumes:
      - prometheus_data:/prometheus
      - ./prometheus.yml:/etc/prometheus/prometheus.yml:ro
      # Read-only protects the file node, not the API: whoever reads this
      # socket can enumerate every container on the host. Accepted for a local
      # stack; a proxy container is the serious answer.
      - /var/run/docker.sock:/var/run/docker.sock:ro
    # The socket is root:docker mode 660 and the image runs as `nobody`, so a
    # supplementary group is what makes it readable. `user: root` also works
    # and is a one-way door: prometheus_data belongs to `nobody`, and files
    # written as root are not readable again after a revert. The inline
    # default is required — no .env exists, and CI would resolve it empty.
    group_add:
      - "${DOCKER_GID:-983}"
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
      - "--storage.tsdb.path=/prometheus"
    ports:
      - "9090:9090"
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:9090/-/healthy"]
      interval: 10s
      timeout: 3s
      retries: 3
      # 10s is measured, not inherited: against a populated volume
      # Prometheus serves in ~0.5s, WAL replay included. Raising this
      # would only delay noticing a boot that never finishes.
      start_period: 10s

  grafana:
    image: grafana/grafana:12.4.7
    profiles: ["core"]
    ports:
      - "3000:3000"
    environment:
      - GF_SECURITY_ADMIN_USER=admin
      - GF_SECURITY_ADMIN_PASSWORD=admin
    volumes:
      - grafana_data:/var/lib/grafana
      - ./grafana/provisioning/dashboards:/etc/grafana/provisioning/dashboards:ro
      - ./grafana/dashboards:/var/lib/grafana/dashboards:ro
      - ./grafana/provisioning/datasources:/etc/grafana/provisioning/datasources:ro
    depends_on:
      prometheus:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:3000/api/health"]
      interval: 10s
      timeout: 3s
      retries: 3
      start_period: 90s

  otel-collector:
    # The contrib distribution rather than the core one: the connector
    # the metrics rework needs ships only here, and starting on core
    # would mean moving a repository name through this file and both
    # documents later for nothing gained now.
    image: otel/opentelemetry-collector-contrib:0.160.0
    profiles: ["core"]
    volumes:
      - ./otel-collector-config.yaml:/etc/otelcol-contrib/config.yaml:ro
    labels:
      prometheus.io/scrape: "true"
      prometheus.io/job: "otel-collector"
      # The port its own telemetry is published on, declared in the
      # config file rather than defaulted — see the comment there.
      prometheus.io/port: "8888"
    restart: unless-stopped
    # No `ports:` and no healthcheck, for the reason the noisy service
    # has neither and one more: the image ships no shell, so a probe
    # would mean choosing an image for the probe's sake, which the
    # pinning rule forbids. Publishing nothing is what excuses it from
    # the healthcheck rule derived from `ports:`.

  tempo:
    image: grafana/tempo:3.0.3
    profiles: ["core"]
    command: ["-config.file=/etc/tempo.yaml"]
    volumes:
      # Both paths in tempo.yaml sit under this mount, so a trace
      # survives a `down` the way the dashboard state does.
      - tempo_data:/var/tempo
      - ./tempo.yaml:/etc/tempo.yaml:ro
    labels:
      prometheus.io/scrape: "true"
      prometheus.io/job: "tempo"
      prometheus.io/port: "3200"
    restart: unless-stopped
    # No published port and no healthcheck, for the same two reasons.

  loadgen:
    build:
      context: ./worker
      dockerfile: Dockerfile
    profiles: ["load"]
    depends_on:
      app:
        condition: service_healthy
      service-go:
        condition: service_healthy
      service-node:
        condition: service_healthy
    restart: unless-stopped

volumes:
  prometheus_data:
  grafana_data:
  tempo_data: