global:
  scrape_interval: 5s

  # Layer two of the cardinality guard: the backstop for what layer one's drop
  # rules did not anticipate. Every one of these is all-or-nothing — exceeding
  # it fails that target's whole scrape, it does not discard the offending
  # sample — which is why the surgical rules come first and these come second.
  #
  # They live in `global:` rather than on the job so that a job added later
  # inherits them. There is one job today, which is exactly when a limit
  # written on it would look equivalent and stop being so.
  #
  # A limit set too tight is nearly mute: the target goes to up=0 and the
  # reason lives in a log line and in a counter no panel here can read. So
  # every number below is the measured worst case with room, not a snug fit.
  # Measured 2026-08-30 across the three well-behaved targets, again
  # 2026-09-05 once the trace path joined the scrape, and again 2026-09-07
  # once the request metrics moved to the Collector. Every measurement
  # below is from that last reading; no value moved with it.

  # Samples per scrape, counted after metric relabeling. Largest measured
  # target: 1510 (Tempo), and 4000 is 2.6x that — the thinnest margin here, and
  # the reason to state it rather than inherit the ~7x this comment claimed
  # against an older reading. The headroom is still deliberate: a target's count
  # drifts upward on its own, Tempo's with tenants, routes and queues.
  #
  # The Collector is second at 343, carrying the request metrics of all three
  # services plus its own telemetry; the applications themselves now read 16,
  # 48 and 96, having stopped counting requests. Raising this value to widen
  # Tempo's margin would loosen the backstop for those three by the same
  # factor, so it stays. Layer one is what bounds them; this is the backstop
  # for what no rule anticipated.
  sample_limit: 4000
  # Labels per sample, __name__ included, plus the `job` and `instance` this
  # file attaches. Largest measured: 10 (Tempo), 8 on the derived metrics —
  # which reached 14 before the labeldrop in metric_relabel_configs below — the
  # closest anything has come to a limit here. 20 leaves room for a service
  # with a richer convention.
  label_limit: 20
  # Longest label name measured: 25 (`http_response_status_code`, from the
  # derived metrics). The dotted names the Collector used to bring —
  # `service.instance.id` and its neighbours, which PromQL reaches only as
  # {"service.instance.id"=…} — are dropped by that same labeldrop.
  label_name_length_limit: 64
  # Longest label value measured: 71 (a Tempo metric name; __name__ counts
  # here too, which is why the longest value is not a label at all). The
  # longest real label value is 43. A raw path can be far longer, which is the
  # point: this catches the label that is a payload rather than a name.
  label_value_length_limit: 256
  # Targets for this job. Discovery is already filtered to this compose
  # project, so today's number is 5 — the three services, the Collector and
  # Tempo, with `noisy` making six when the chaos profile is up. 20 is the
  # ceiling on that filter failing open, and unlike the others it marks targets
  # failed without scraping them.
  target_limit: 20
  # The exposition body itself, which is memory during the scrape rather than
  # series after it. Largest well-behaved target: 166 KB (Tempo), with the
  # Collector second at 119 KB now that it answers for three services. The noisy
  # service reached 467 KB inside an hour before its ramp was given a top, and
  # plateaus at ~346 KB now — so this is the limit that bounds an exporter
  # whose *body* runs away even when its labels are ordinary.
  body_size_limit: 4MB
  # keep_dropped_targets is deliberately not set: the project filter already
  # keeps discovery from enumerating the host, and the dropped-target list is
  # what makes a mislabelled service debuggable on /targets.

storage:
  tsdb:
    retention:
      time: 7d
      size: 512MB

scrape_configs:
  # One job for every service. A service joins the scrape by declaring the
  # labels in its own compose block, not by being written down here.
  - job_name: "docker-labels"
    docker_sd_configs:
      # 15s, not the 60s default: a container that starts should become a
      # target in seconds, since that delay is the demonstration.
      - host: unix:///var/run/docker.sock
        refresh_interval: 15s
        # The socket enumerates every container on the host, and
        # `prometheus.io/scrape` is a convention other stacks use too, so the
        # opt-in below is not enough on its own: a container from an unrelated
        # project would join with an address rebuilt from *its* compose service
        # name, which does not resolve on this network — a permanently down
        # target and a foreign value in the `job` dropdown. The project name is
        # compose's default, the directory name; COMPOSE_PROJECT_NAME means
        # changing it here too.
        filters:
          - name: label
            values: ["com.docker.compose.project=url_observability"]
    relabel_configs:
      # Opt in, or be discarded. Without this `keep`, discovery means scraping
      # every container that starts — Prometheus and Grafana included.
      - source_labels: [__meta_docker_container_label_prometheus_io_scrape]
        regex: "true"
        action: keep
      # Opting in without declaring both is a broken identity, not a default
      # to fall back on: `replace` *deletes* the `job` label when the value is
      # empty, so the target would carry no `job` at all, and the address
      # would be rebuilt as `service:`. Dropping the container is the same
      # answer tests/test_compose_config.py gives for this repo's own file.
      - source_labels:
          - __meta_docker_container_label_prometheus_io_job
          - __meta_docker_container_label_prometheus_io_port
        regex: (.+);(.+)
        action: keep
      # `job` comes from the label, never from the compose service name:
      # the series already in prometheus_data are keyed by these values.
      - source_labels: [__meta_docker_container_label_prometheus_io_job]
        target_label: job
      # `instance` likewise: the address is rebuilt from the compose service
      # name and the declared port, so it stays `app:8002` instead of becoming
      # a container IP that changes on every recreate. Rebuilding it also
      # collapses a container's published ports into a single target.
      - source_labels:
          - __meta_docker_container_label_com_docker_compose_service
          - __meta_docker_container_label_prometheus_io_port
        separator: ":"
        target_label: __address__
      # Optional. `(.+)` is what leaves the /metrics default alone when a
      # service declares no path — without it an absent label writes an empty
      # __metrics_path__.
      - source_labels: [__meta_docker_container_label_prometheus_io_path]
        regex: (.+)
        target_label: __metrics_path__

    # Layer one of the cardinality guard, and the surgical one: the offending
    # series is thrown away and the rest of the target is still stored. It runs
    # *before* the limits in `global:` are checked, so what it drops never
    # counts against the ceiling.
    #
    # The selection is on the **shape of the value**, never on a job name. A
    # rule naming a service would work, would be easier to write, and would put
    # back in this file the list of services that discovery took out of it.
    #
    # One rule per path-carrying label, because there is no wildcard over label
    # values: `source_labels` names labels explicitly, and labeldrop/labelkeep
    # match label *names*. One left. There were three — `handler` from the app's
    # instrumentator and `route` from the Node service beside it — and each went
    # with the convention it guarded; `http_route`, derived from the spans, is
    # what all three services report under now. A fourth convention would need a
    # second rule again.
    #
    # What this cannot reach: an id in a label of a service's own naming. That
    # is what the ceiling is for.
    metric_relabel_configs:
      # The derived request metrics arrive from one target that answers for
      # three services, so without this every one of them is keyed by the
      # Collector and every `by (job)` panel collapses into one line.
      #
      # The selection is on presence, and never a service name. It reads
      # `service_name` rather than `exported_job` because that is the label
      # separating a measurement *about* a service from the exporter's own
      # telemetry: the Collector republishes its internal metrics on the same
      # port under `exported_job=otelcol-contrib` with no `service_name`, so the
      # other choice would rename its 54 own series out of its dashboard row.
      #
      # The cost, stated: for these series `job` stops meaning "the target that
      # was scraped", while `instance` still names the Collector.
      - source_labels: [service_name]
        regex: (.+)
        target_label: job
      # What the OTLP-to-Prometheus translation attaches and nothing here reads:
      # the scope triplet, the Collector's instance uuid — which changes on every
      # restart, so keeping it re-keys the series — and the two names the rule
      # above already folded into `job`. Measured at 14 labels per sample against
      # `label_limit: 20`, the tightest of the five limits.
      - regex: exported_job|exported_instance|service_name|collector_instance_id|otel_scope_.*
        action: labeldrop
      - source_labels: [http_route]
        regex: '(.*/)?([0-9]+|[0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{12})(/.*)?'
        action: drop
