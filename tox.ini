[tox]
envlist = py311, lint

[testenv]
deps =
    pytest
    pytest-cov
    prometheus-fastapi-instrumentator
    -rrequirements/dev.txt
commands =
    pytest --cov=app --cov-fail-under=80 --cov-report term-missing tests/

[testenv:lint]
deps =
    black
    flake8
    isort
commands =
    black .
    isort .
    flake8 .
    