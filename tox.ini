[tox]
envlist = py311, lint
skipsdist = true

[testenv]
deps =
    -rrequirements/dev.txt
    pytest
    pytest-cov
commands =
    pytest --cov=app --cov=worker --cov-fail-under=80 --cov-report term-missing tests/

[testenv:lint]
deps =
    black
    flake8
    isort
commands =
    black --check .
    isort --check-only .
    flake8 .
    