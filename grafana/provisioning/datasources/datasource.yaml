apiVersion: 1

# Runs before the insert below, on every start. It exists because giving
# an already provisioned datasource a `uid` is not an in-place update:
# Grafana matches the existing one by name, then looks it up by the new
# uid to update it, fails to find it, and aborts the whole provisioning
# module — the container never becomes healthy. Deleting first is the way
# out. Keep this block: any volume provisioned before the uid was added
# still needs it, and on a fresh volume it is a no-op.
#
# Two consequences of it running every start, not just the first. A
# dashboard someone built by hand before the uid existed references the
# old generated one and loses its datasource — see "Stopping and cleaning
# up" in README.md. And a datasource created by hand under this name in
# org 1 is removed at the next restart; provisioning owns this name.
deleteDatasources:
  - name: prometheus
    orgId: 1

datasources:
  - name: prometheus
    uid: prometheus
    type: prometheus
    access: proxy
    url: http://prometheus:9090
    isDefault: true
    editable: false
    jsonData:
      # Must match `global.scrape_interval` in prometheus.yml — a test
      # asserts it. Without this Grafana assumes its own 15s default, and
      # `$__rate_interval`, which is derived from it, never resolves below
      # 60s however far the time picker is zoomed in.
      timeInterval: 5s
