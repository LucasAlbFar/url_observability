[tool.poetry]
name = "fastapi_project"
version = "0.1.0"
description = "FastAPI Project Setup"
authors = ["Lucas"]

[tool.poetry.dependencies]
python = "^3.11"
fastapi = { extras = ["standard-no-fastapi-cloud-cli"], version = "^0.139.2" }
uvicorn = { extras = ["standard"], version = "^0.51.0" }
pydantic = "^2.13.4"
pydantic-settings = "^2.14.2"
prometheus-fastapi-instrumentator = "^8.0.2"

[tool.poetry.dev-dependencies]
pytest = "^9.1.1"
pytest-asyncio = "^1.4.0"
pytest-cov = "^7.1.0"
httpx = "^0.28.1"
flake8 = "^7.3.0"
black = "^26.5.1"
isort = "^8.0.1"
pyyaml = "^6.0.3"
