# This workflow will install Python dependencies, run tests and lint with a single version of Python
# For more information see: https://docs.github.com/en/actions/automating-builds-and-tests/building-and-testing-python

name: Python application

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

permissions:
  contents: read

jobs:
  build:

    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v7
    - name: Set up Python 3.11
      uses: actions/setup-python@v7
      with:
        python-version: "3.11"
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install tox
        if [ -f requirements/dev.txt ]; then pip install -r requirements/dev.txt; fi
    - name: Run tox
      run: tox

  go:

    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: service-go

    steps:
    - uses: actions/checkout@v7
    # The toolchain is read out of go.mod rather than named here, for
    # the reason the infra job reads the Prometheus image out of the
    # compose file: one place to bump, and CI cannot drift from it.
    - name: Set up Go
      uses: actions/setup-go@v7
      with:
        go-version-file: service-go/go.mod
        # Without this the action looks for go.sum at the repo root,
        # misses it, and warns that the cache could not be restored.
        cache-dependency-path: service-go/go.sum
    # gofmt reports by printing filenames and still exits 0, so the
    # check is on its output, not on its status.
    - name: Check formatting
      run: |
        unformatted=$(gofmt -l .)
        [ -z "$unformatted" ] \
          || { echo "gofmt would rewrite:"; echo "$unformatted"; exit 1; }
    - name: Vet
      run: go vet ./...
    - name: Test
      run: go test ./...

  node:

    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: service-node

    steps:
    - uses: actions/checkout@v7
    # The version is read out of package.json, for the reason the go job
    # reads go.mod and the infra job reads the compose file: one place to
    # bump, and CI cannot drift from what the image runs. `engines.node`
    # is the field setup-node reads there.
    - name: Set up Node
      uses: actions/setup-node@v7
      with:
        node-version-file: service-node/package.json
        cache: npm
        cache-dependency-path: service-node/package-lock.json
    # `npm ci` rather than `npm install`: it installs exactly the
    # lockfile and fails when the two have drifted, which is the whole
    # value of committing it.
    - name: Install dependencies
      run: npm ci
    - name: Test
      run: npm test

  infra:

    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v7
    # Every service sits behind a profile, so a bare `config` would
    # validate an empty file and still exit 0. The wildcard is
    # load-bearing, and the second command proves it resolved.
    - name: Validate the compose file
      run: |
        docker compose --profile '*' config -q
        docker compose --profile '*' config --services | grep -q . \
          || { echo "--profile '*' resolved no services"; exit 1; }
    # The image is read out of the compose file rather than repeated
    # here, so a bump is one line and CI cannot end up validating
    # prometheus.yml against a Prometheus the stack does not run.
    - name: Validate the Prometheus config
      run: |
        image=$(docker compose --profile '*' config --format json \
          | jq -r '.services.prometheus.image')
        [ -n "$image" ] && [ "$image" != "null" ] \
          || { echo "could not resolve the prometheus image"; exit 1; }
        echo "using $image"
        docker run --rm --entrypoint promtool \
          -v "$PWD/prometheus.yml:/etc/prometheus/prometheus.yml:ro" \
          "$image" \
          check config /etc/prometheus/prometheus.yml
    # The same shape for the same reason: two configuration files only
    # their own binary can judge, and a structural test in pytest
    # cannot say whether the process would refuse them at boot.
    - name: Validate the Collector config
      run: |
        image=$(docker compose --profile '*' config --format json \
          | jq -r '.services["otel-collector"].image')
        [ -n "$image" ] && [ "$image" != "null" ] \
          || { echo "could not resolve the collector image"; exit 1; }
        echo "using $image"
        docker run --rm \
          -v "$PWD/otel-collector-config.yaml:/etc/otelcol-contrib/config.yaml:ro" \
          "$image" validate --config=/etc/otelcol-contrib/config.yaml
    # `-config.verify=true`, with the value: the flag is declared as
    # taking one, so a bare `-config.verify` prints the usage text and
    # exits 2 — a failure that reads as a broken config file.
    - name: Validate the Tempo config
      run: |
        image=$(docker compose --profile '*' config --format json \
          | jq -r '.services.tempo.image')
        [ -n "$image" ] && [ "$image" != "null" ] \
          || { echo "could not resolve the tempo image"; exit 1; }
        echo "using $image"
        docker run --rm -v "$PWD/tempo.yaml:/etc/tempo.yaml:ro" \
          "$image" -config.file=/etc/tempo.yaml -config.verify=true
    # `-verify-config` rather than `-config.verify`: Loki spells the
    # same thing the other way round, and the wrong one boots the
    # store instead of checking its file.
    - name: Validate the Loki config
      run: |
        image=$(docker compose --profile '*' config --format json \
          | jq -r '.services.loki.image')
        [ -n "$image" ] && [ "$image" != "null" ] \
          || { echo "could not resolve the loki image"; exit 1; }
        echo "using $image"
        docker run --rm -v "$PWD/loki.yaml:/etc/loki.yaml:ro" \
          "$image" -config.file=/etc/loki.yaml -verify-config

  # The other four validate files; this one starts the stack and proves
  # the chain answers. One error, provoked on purpose, and its trace id
  # followed into both stores — the walk from graph to logs, without the
  # browser. Tempo and Loki publish no port, so they are read through
  # Grafana's datasource proxy, which tests the provisioned datasources
  # on the way.
  smoke:

    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v7
    # The runner's docker group is not this machine's 983, and a wrong id
    # fails quietly: Prometheus reports healthy and discovers nothing.
    - name: Read the docker group id
      run: |
        echo "DOCKER_GID=$(getent group docker | cut -d: -f3)" >> "$GITHUB_ENV"
    # `--wait` inherits Grafana's 90s start_period; the timeout is the
    # ceiling on a cold runner building three images.
    - name: Start the stack
      run: docker compose --profile core up --build --wait --wait-timeout 600
    # The trace id is the test's own, sent as a traceparent: every SDK
    # here continues an incoming context, so nothing has to be parsed out
    # of a response to know which trace to look for.
    - name: Follow one error into every store
      run: |
        grafana=http://admin:admin@localhost:3000/api/datasources/proxy/uid
        trace=$(openssl rand -hex 16)

        status=$(curl -s -o /dev/null -w '%{http_code}' \
          -H "traceparent: 00-$trace-$(openssl rand -hex 8)-01" \
          localhost:8002/fail)
        [ "$status" = 500 ] || { echo "/fail answered $status"; exit 1; }

        # Read from the compose labels rather than written here, so a
        # service joining the scrape does not have to edit this job.
        expected=$(docker compose --profile core config --format json \
          | jq '[.services[].labels["prometheus.io/scrape"] // empty
                 | select(. == "true")] | length')

        wait_for() {
          local deadline=$((SECONDS + 120))
          until eval "$2"; do
            [ "$SECONDS" -lt "$deadline" ] || { echo "timed out: $1"; exit 1; }
            sleep 5
          done
          echo "ok: $1"
        }

        wait_for "every scraped service is up ($expected)" \
          '[ "$(curl -s localhost:9090/api/v1/query --data-urlencode "query=count(up == 1)" \
              | jq -r ".data.result[0].value[1] // 0")" = "$expected" ]'
        wait_for "the trace reached Tempo" \
          'curl -sf "$grafana/tempo/api/traces/$trace" > /dev/null'
        wait_for "the line reached Loki with its trace id" \
          '[ "$(curl -s -G "$grafana/loki/loki/api/v1/query_range" \
              --data-urlencode "query={service_name=\"fastapi-app\"} | trace_id=\"$trace\"" \
              | jq "[.data.result[].values[]] | length")" -gt 0 ]'
    - name: Show what the stack logged
      if: failure()
      run: docker compose --profile core logs --no-color --tail 100
    - name: Tear down
      if: always()
      run: docker compose --profile core down --volumes
