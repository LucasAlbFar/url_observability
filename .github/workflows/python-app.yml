# This workflow will install Python dependencies, run tests and lint with a single version of Python
# For more information see: https://docs.github.com/en/actions/automating-builds-and-tests/building-and-testing-python

name: Python application

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

permissions:
  contents: read

jobs:
  build:

    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4
    - name: Set up Python 3.11
      uses: actions/setup-python@v5
      with:
        python-version: "3.11"
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install tox
        if [ -f requirements/dev.txt ]; then pip install -r requirements/dev.txt; fi
    - name: Run tox
      run: tox

  infra:

    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4
    # Every service sits behind a profile, so a bare `config` would
    # validate an empty file and still exit 0. The wildcard is
    # load-bearing, and the second command proves it resolved.
    - name: Validate the compose file
      run: |
        docker compose --profile '*' config -q
        docker compose --profile '*' config --services | grep -q . \
          || { echo "--profile '*' resolved no services"; exit 1; }
    # The image is read out of the compose file rather than repeated
    # here, so a bump is one line and CI cannot end up validating
    # prometheus.yml against a Prometheus the stack does not run.
    - name: Validate the Prometheus config
      run: |
        image=$(docker compose --profile '*' config --format json \
          | jq -r '.services.prometheus.image')
        [ -n "$image" ] && [ "$image" != "null" ] \
          || { echo "could not resolve the prometheus image"; exit 1; }
        echo "using $image"
        docker run --rm --entrypoint promtool \
          -v "$PWD/prometheus.yml:/etc/prometheus/prometheus.yml:ro" \
          "$image" \
          check config /etc/prometheus/prometheus.yml
