# This workflow will install Python dependencies, run tests and lint with a single version of Python
# For more information see: https://docs.github.com/en/actions/automating-builds-and-tests/building-and-testing-python

name: Python application

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

permissions:
  contents: read

jobs:
  build:

    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4
    - name: Set up Python 3.11
      uses: actions/setup-python@v5
      with:
        python-version: "3.11"
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install tox
        if [ -f requirements/dev.txt ]; then pip install -r requirements/dev.txt; fi
    - name: Run tox
      run: tox

  infra:

    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4
    # Every service sits behind a profile, so a bare `config` would
    # validate an empty file and still exit 0. The wildcard is
    # load-bearing, and the second command proves it resolved.
    - name: Validate the compose file
      run: |
        docker compose --profile '*' config -q
        docker compose --profile '*' config --services | grep -q . \
          || { echo "--profile '*' resolved no services"; exit 1; }
    - name: Validate the Prometheus config
      run: |
        docker run --rm --entrypoint promtool \
          -v "$PWD/prometheus.yml:/etc/prometheus/prometheus.yml:ro" \
          prom/prometheus:v3.13.2 \
          check config /etc/prometheus/prometheus.yml
